name: Frontend Design Implementation
description: Create a new Frontend Design Implementation
title: "FDI:"
labels: ["software-engineering"]
type: "Frontend Design Implementation"

body:
  - type: markdown
    attributes:
      value: |
        Please fill out the fields below.
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Describe the design work to be done."
      value: "As a…

        I need/want/expect to…

        So that…"
    validations:
      required: true
  - type: textarea
    id: tasklist
    attributes:
      label: Task List
      value: |
        - [ ] Task 1
        - [ ] Task 2
        - [ ] Task 3
        - [ ] Task 4
   - type: textarea
    id: functional-requirements
    attributes:
      label: Functional Requirements
      description: Only if essential. High-level capability needed for this story.
      placeholder: |
        -
    validations:
      required: false
  - type: textarea
    id: non-functional-requirements
    attributes:
      label: Non-Functional Requirements
      description: Performance/security/usability expectations
      placeholder: |
        -
    validations:
      required: false
      
  - type: textarea
    id: figma-prototype-link
    attributes:
      description: Please add a link to the Figma prototype if available.
      label: Figma Prototype Link
      value: |
        [Figma ](https://www.figma.com/file/xxxxxx)
    validations:
      required: false
  - type: textarea
    id: figma-dev-mode-link
    attributes:
      description: Please add a link to the Figma design file in Dev Mode if available.
      placeholder: https://www.figma.com/file/xxxxxx
      label: Figma Dev Mode Link
      value: |
        [Figma Dev](https://www.figma.com/file/xxxxxx)
    validations:
      required: false
  - type: textarea
    id: content-link
    attributes:
      description: Please add any links to content documents if available.
      label: Content Link(s)
      value: |
        [Content Doc](https://www.figma.com/file/xxxxxx)
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      description: Please add any links to content screenshots or diagrams if available.
      label: Screenshots
       placeholder: |
        -
    validations:
      required: false
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      placeholder: "Define the criteria for when this design work is considered done."
      value: |
        - [ ] Designer has reviewed
        - [ ] User docs have been updated
        - [ ] Post deployment team review
    validations:
      required: false
