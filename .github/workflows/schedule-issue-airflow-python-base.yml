---
name: 📥 Maintenance - Create Airflow Python Base Issue

on:
  schedule:
    - cron: "0 8 * * 2" # UTC time: "At 08:00 on Tuesday", gated to every third week
  workflow_dispatch:

permissions: {}

jobs:
  create-maintenance-issue:
    name: Create Maintenance Issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Schedule
        id: check_schedule
        run: |
          bash scripts/github/issue-creation/check-three-weekly-schedule.sh
      - name: Obtain Octo STS Token
        id: octo_sts
        if: steps.check_schedule.outputs.run == 'true'
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ministryofjustice/data-platform
          identity: schedule-maintenance-issues
      - name: Create Maintenance Issue
        id: create_maintenance_issue
        if: steps.check_schedule.outputs.run == 'true'
        run: |
          bash scripts/github/issue-creation/create-maintenance-issue.sh
        env:
          GH_TOKEN: ${{ steps.octo_sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 📥 Maintenance - Airflow Python Base Image
          ASSIGNEES: ""
          LABELS: maintenance,platform-engineering,squad-one
          BODY: |
            > [!NOTE]
            > This issue is created by a scheduled workflow.

            ### User Story

            As an… engineer on the Analytical Platform
            I need/want/expect to… keep the Airflow Python Base image up to date
            So that… security / best practice etc

            ### Definition of Done

            > [!TIP]
            > This repository has a [`/maintenance` prompt](https://github.com/ministryofjustice/analytical-platform-airflow-python-base/blob/main/.github/prompts/maintenance.prompt.md). Run it in Copilot Chat from a checkout of [analytical-platform-airflow-python-base](https://github.com/ministryofjustice/analytical-platform-airflow-python-base) to carry out the update and raise the pull request.

            - [ ] Merge any open dependabot Pull Requests in the repository (noted below).
            - [ ] In the [repository](https://github.com/ministryofjustice/analytical-platform-airflow-python-base), confirm that the [software](https://github.com/ministryofjustice/analytical-platform-airflow-python-base?tab=readme-ov-file#managing-software-versions) and [tests](https://github.com/ministryofjustice/analytical-platform-airflow-python-base/blob/main/test/container-structure-test.yml) are up-to-date.
            - [ ] Create a new [release](https://github.com/ministryofjustice/analytical-platform-airflow-python-base/releases).

          PINNED: false
          CLOSE_PREVIOUS: false
